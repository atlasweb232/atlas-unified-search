openapi: 3.1.0
info:
  title: Atlas Unified Search API
  version: 0.1.0
paths:
  /v1/search:
    post:
      summary: Search across connected sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /v1/search-runs:
    post:
      summary: Start a federated search run across selected source agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "202":
          description: Search run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRunResponse"
  /v1/search-runs/{searchRunId}:
    get:
      summary: Get search run status and current merged results
      parameters:
        - name: searchRunId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRunResponse"
  /v1/connectors:
    get:
      summary: List connector status for the current user
      responses:
        "200":
          description: Connector status list
  /v1/connectors/readiness:
    get:
      summary: Check configured connector readiness without exposing secret values
      responses:
        "200":
          description: Connector readiness checks
  /v1/index/status:
    get:
      summary: Get tenant/user-scoped index counts
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scoped index status
  /v1/sync/{source}:
    post:
      summary: Start a source sync
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
      responses:
        "202":
          description: Sync accepted
  /v1/reindex/{source}:
    post:
      summary: Delete scoped source data, reset source checkpoints, and start a full source sync
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
      responses:
        "202":
          description: Reindex accepted
  /v1/documents:
    delete:
      summary: Delete documents scoped by tenant/user and optional source or document IDs
      responses:
        "200":
          description: Scoped deletion result
  /v1/documents/{documentId}:
    get:
      summary: Get expandable document details
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
  /v1/audit:
    get:
      summary: List redacted audit events scoped to tenant and user
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Tenant/user-scoped redacted audit event list
  /v1/jobs:
    get:
      summary: List sync jobs scoped to tenant and user
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant/user-scoped sync job list
  /v1/assistant/actions:
    post:
      summary: Run an assistant action over retrieved search results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantActionRequest"
      responses:
        "202":
          description: Assistant action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantActionResponse"
  /v1/assistant/actions/{actionJobId}:
    get:
      summary: Get assistant action or artifact job status
      parameters:
        - name: actionJobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assistant action status
components:
  schemas:
    SearchRequest:
      type: object
      required: [tenantId, userId, query]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        query:
          type: string
        sources:
          type: array
          items:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
        filters:
          type: object
          properties:
            containers:
              type: array
              items:
                type: string
            authors:
              type: array
              items:
                type: string
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        limit:
          type: integer
          default: 10
    SearchResponse:
      type: object
      required: [success, results]
      properties:
        success:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchRunResponse:
      type: object
      required: [success, searchRun]
      properties:
        success:
          type: boolean
        searchRun:
          $ref: "#/components/schemas/SearchRun"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchRun:
      type: object
      required: [id, tenantId, userId, query, status, selectedSources]
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        query:
          type: string
        status:
          type: string
          enum: [queued, running, partial, completed, failed]
        selectedSources:
          type: array
          items:
            type: string
        sourceStatuses:
          type: array
          items:
            $ref: "#/components/schemas/SourceSearchAgentStatus"
    SourceSearchAgentStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        resultCount:
          type: integer
        error:
          type: string
    SearchResult:
      type: object
      required: [id, source, title, oneLine, score]
      properties:
        id:
          type: string
        source:
          type: string
        sourceIcon:
          type: string
        sourceLabel:
          type: string
        title:
          type: string
        oneLine:
          type: string
        author:
          type: string
        timestamp:
          type: string
          format: date-time
        container:
          type: string
        score:
          type: number
        sourceUri:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRef"
        links:
          type: array
          items:
            type: string
        children:
          type: array
          items:
            type: object
        metadata:
          type: object
    AttachmentRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        secureOpenUrl:
          type: string
        textIndexed:
          type: boolean
        metadata:
          type: object
    AssistantActionRequest:
      type: object
      required: [tenantId, userId, searchRunId, actionType, selectedResultIds]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        searchRunId:
          type: string
        actionType:
          type: string
          enum: [summarize, answer_question, draft_email, create_powerpoint, create_pdf, extract_action_items, compare_sources]
        selectedResultIds:
          type: array
          items:
            type: string
        prompt:
          type: string
        provider:
          type: string
          description: Optional provider override; backend validates allowed providers.
    AssistantActionResponse:
      type: object
      required: [success, actionJob]
      properties:
        success:
          type: boolean
        actionJob:
          type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [queued, running, completed, failed]
            responseText:
              type: string
            artifacts:
              type: array
              items:
                type: object
