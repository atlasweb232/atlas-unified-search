openapi: 3.1.0
info:
  title: Atlas Unified Search API
  version: 0.1.0
paths:
  /v1/search:
    post:
      summary: Search across connected sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /v1/search-runs:
    post:
      summary: Start a federated search run across selected source agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "202":
          description: Search run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRunResponse"
  /v1/search-runs/{searchRunId}:
    get:
      summary: Get search run status and current merged results
      parameters:
        - name: searchRunId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRunResponse"
  /v1/search-runs/{searchRunId}/events:
    get:
      summary: Stream search run snapshots with Server-Sent Events
      description: >
        Authenticated SSE stream for the current tenant/user scope. Emits
        `snapshot` events whenever source-agent status or partial results
        change, followed by `done` when the run reaches completed, partial, or
        failed. Clients must pass tenantId and userId as query parameters or
        scope headers; bearer auth remains in the Authorization header.
      parameters:
        - name: searchRunId
          in: path
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event stream of search run snapshots
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          description: Search run does not belong to the requested tenant/user
  /v1/connectors:
    get:
      summary: List connector status for the current user
      responses:
        "200":
          description: Connector status list
  /v1/connectors/readiness:
    get:
      summary: Check configured connector readiness without exposing secret values
      responses:
        "200":
          description: Connector readiness checks
  /v1/index/status:
    get:
      summary: Get tenant/user-scoped index counts
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scoped index status
  /v1/sync/{source}:
    post:
      summary: Start a source sync
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
      responses:
        "202":
          description: Sync accepted
  /v1/events/{source}:
    post:
      summary: Accept an authenticated connector event and enqueue a scoped sync job
      description: >
        Converts provider notifications such as Slack message events, Google
        Drive changes, conference blob notifications, or CMS/data-fabric events
        into tenant/user-scoped sync jobs. The endpoint uses the same API auth,
        source permission, and connector readiness gates as live sync. Fixture
        payloads are ignored so events cannot bypass live connector readiness.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
      responses:
        "202":
          description: Event accepted and sync queued
        "409":
          description: Connector is not ready for live event ingestion
  /v1/webhooks/slack/events:
    post:
      summary: Accept verified Slack Events API callbacks
      description: >
        Public Slack Events API ingress. This endpoint bypasses Atlas bearer
        auth only after verifying X-Slack-Signature with SLACK_SIGNING_SECRET
        and a fresh X-Slack-Request-Timestamp. URL verification returns the
        Slack challenge. Event callbacks are mapped to SLACK_EVENT_TENANT_ID and
        SLACK_EVENT_USER_ID, then use the same source permission, readiness,
        audit, and queue path as /v1/events/slack. It never accepts fixture
        payloads and returns 409 until Slack live readiness passes.
      responses:
        "200":
          description: Slack URL verification challenge accepted
        "202":
          description: Signed Slack event accepted and sync queued
        "401":
          description: Missing, invalid, or stale Slack signature
        "409":
          description: Slack connector is not ready for live event ingestion
  /v1/webhooks/google-drive/changes:
    post:
      summary: Accept verified Google Drive push notifications
      description: >
        Public Google Drive Changes/watch ingress. This endpoint bypasses Atlas
        bearer auth only after verifying X-Goog-Channel-Token with
        GDRIVE_WEBHOOK_TOKEN and, when configured, X-Goog-Channel-ID against
        GDRIVE_WEBHOOK_CHANNEL_IDS. Notifications are mapped to
        GDRIVE_EVENT_TENANT_ID and GDRIVE_EVENT_USER_ID, then use the same
        source permission, readiness, audit, and queue path as
        /v1/events/google_drive. Google Drive push notifications do not provide
        an HMAC signature, so the channel token must be unguessable and stored
        backend-side.
      responses:
        "202":
          description: Verified Google Drive notification accepted and sync queued
        "401":
          description: Missing or invalid Google Drive channel token/id
        "409":
          description: Google Drive connector is not ready for live event ingestion
  /v1/webhooks/azure-blob/events:
    post:
      summary: Accept verified Azure Blob Event Grid notifications
      description: >
        Public Azure Event Grid ingress for conference bridge BlobCreated
        events. This endpoint bypasses Atlas bearer auth only after verifying
        X-Atlas-Event-Grid-Token, or the token query parameter, with
        CONFERENCE_EVENT_GRID_TOKEN. Subscription validation events return the
        required validationResponse. BlobCreated events are mapped to
        CONFERENCE_EVENT_TENANT_ID and CONFERENCE_EVENT_USER_ID, checked against
        CONFERENCE_BLOB_CONTAINERS, then use the same source permission,
        readiness, audit, and queue path as /v1/events/conference_bridge.
      responses:
        "200":
          description: Event Grid subscription validation response
        "202":
          description: Verified BlobCreated notification accepted and sync queued
        "401":
          description: Missing or invalid Event Grid token
        "409":
          description: Conference bridge connector is not ready for live event ingestion
  /v1/reindex/{source}:
    post:
      summary: Delete scoped source data, reset source checkpoints, and start a full source sync
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
      responses:
        "202":
          description: Reindex accepted
  /v1/documents:
    delete:
      summary: Delete documents scoped by tenant/user and optional source or document IDs
      responses:
        "200":
          description: Scoped deletion result
  /v1/sources/{source}/documents:
    delete:
      summary: Delete documents and optionally checkpoints for one source in a tenant/user scope
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
      responses:
        "200":
          description: Source-scoped deletion result
        "403":
          description: Source is not enabled for this tenant/user
  /v1/documents/{documentId}:
    get:
      summary: Get expandable document details
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
  /v1/audit:
    get:
      summary: List redacted audit events scoped to tenant and user
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Tenant/user-scoped redacted audit event list
  /v1/jobs:
    get:
      summary: List sync jobs scoped to tenant and user
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant/user-scoped sync job list
  /v1/assistant/actions:
    post:
      summary: Run an assistant action over retrieved search results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantActionRequest"
      responses:
        "202":
          description: Assistant action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantActionResponse"
  /v1/assistant/actions/{actionJobId}:
    get:
      summary: Get assistant action or artifact job status
      parameters:
        - name: actionJobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assistant action status
components:
  schemas:
    SearchRequest:
      type: object
      required: [tenantId, userId, query]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        query:
          type: string
        sources:
          type: array
          items:
            type: string
            enum: [slack, google_drive, conference_bridge, email, knowledge_base, data_fabric]
        filters:
          type: object
          properties:
            containers:
              type: array
              items:
                type: string
            authors:
              type: array
              items:
                type: string
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        limit:
          type: integer
          default: 10
    SearchResponse:
      type: object
      required: [success, results]
      properties:
        success:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchRunResponse:
      type: object
      required: [success, searchRun]
      properties:
        success:
          type: boolean
        searchRun:
          $ref: "#/components/schemas/SearchRun"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchRun:
      type: object
      required: [id, tenantId, userId, query, status, selectedSources]
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        query:
          type: string
        status:
          type: string
          enum: [queued, running, partial, completed, failed]
        selectedSources:
          type: array
          items:
            type: string
        sourceStatuses:
          type: array
          items:
            $ref: "#/components/schemas/SourceSearchAgentStatus"
    SourceSearchAgentStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        resultCount:
          type: integer
        error:
          type: string
    SearchResult:
      type: object
      required: [id, source, title, oneLine, score]
      properties:
        id:
          type: string
        source:
          type: string
        sourceIcon:
          type: string
        sourceLabel:
          type: string
        title:
          type: string
        oneLine:
          type: string
        author:
          type: string
        timestamp:
          type: string
          format: date-time
        container:
          type: string
        score:
          type: number
        sourceUri:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRef"
        links:
          type: array
          items:
            type: string
        children:
          type: array
          items:
            type: object
        metadata:
          type: object
    AttachmentRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        secureOpenUrl:
          type: string
        textIndexed:
          type: boolean
        metadata:
          type: object
    AssistantActionRequest:
      type: object
      required: [tenantId, userId, searchRunId, actionType, selectedResultIds]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        searchRunId:
          type: string
        actionType:
          type: string
          enum: [summarize, answer_question, draft_email, create_powerpoint, create_pdf, extract_action_items, compare_sources]
        selectedResultIds:
          type: array
          items:
            type: string
        prompt:
          type: string
        provider:
          type: string
          description: Optional provider override; backend validates allowed providers.
    AssistantActionResponse:
      type: object
      required: [success, actionJob]
      properties:
        success:
          type: boolean
        actionJob:
          type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [queued, running, completed, failed]
            responseText:
              type: string
            artifacts:
              type: array
              items:
                type: object
